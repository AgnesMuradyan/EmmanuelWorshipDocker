services:
  db:
    image: postgres:13
    restart: always
    environment:
      POSTGRES_DB: myproject
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    volumes:
      - postgres_data:/var/lib/postgresql/data/

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
    depends_on:
      - db
    env_file:
      - .env

    ports:
      - "8000:8000"
    command: >
      sh -c "uv run --no-sync python manage.py migrate &&
             uv run --no-sync uvicorn backend.asgi:application --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
